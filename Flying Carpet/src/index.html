<!DOCTYPE html>
<html lang="en" style="height: 100%;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>白い熊 魔法絨毯</title>
    <script type="module" src="/main.js" defer></script>
    <script type="module" src="/customize.js" defer></script>
    <!-- fork: paired devices — the one-click send. Loaded after customize.js, whose dialog
         primitives it imports. customize.js itself imports roles.js (the one table every
         colour comes from) and icons.js. -->
    <script type="module" src="/devices.js" defer></script>
    <!-- fork: parallel paired transfers — one progress block per running or queued lane. -->
    <script type="module" src="/lanes.js" defer></script>
    <!-- <script type="module" src="/deps/bootstrap.bundle.min.js" defer></script> -->
    <link rel="stylesheet" href="/deps/bootstrap.min.css">
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="customize.css" />
  </head>

  <body style="height: 100%;">
    <div class="verticalContainer" id="mainContainer" style="height: 100%;">

      <!-- top bar -->
      <div class="horizontalContainer" style="flex-grow: 0; margin: 10px;">
        <div>
          <h1 id="programTitle" style="font-size: 40px; margin-bottom: 0px; padding-bottom: 0px;"><b>白い熊 魔法絨毯</b></h1>
          <small id="versionLabel" style="margin-top: 0px; padding-top: 0px;">Version 10</small>
          <button type="button" class="fork-pill fork-small" style="float: right;" id="aboutButton">About</button>
        </div>
        <div class="verticalContainer" style="align-items: flex-end;">
          <div id="qrcode" style="width: 150px; height: 150px;">
            <img src="assets/icon1024.png" data-logo style="width: 150px; height: 150px;">
          </div>
          <button type="button" class="fork-pill fork-small" id="uiButton" onclick="window.forkUI.openSettings()">白い熊 魔法絨毯 UI</button>
          <!-- fork: paired devices. Sits with the UI button rather than in the mode row,
               because it is not a third connection mode — it is a different way in, one
               that skips the mode, the password and arming the other device entirely. -->
          <button type="button" class="fork-pill fork-small" id="devicesButton" onclick="window.forkDevices.openDevicesPanel()">Devices ＋</button>
        </div>
      </div>
      <!-- fork: the paired devices, one click each — the desktop end of the Android main page's
           strip. A column per device: the top pill sends over this network, the bottom one
           over a hotspot. Filled by devices.js; hidden until something is paired. -->
      <div id="devicePills" hidden></div>
      <div class="horizontalContainer" id="bluetoothRow" style="flex-grow: 0; margin: 10px;">
        <!-- fork: the theme's switch — an outlined pill with a dot, drawn in customize.css -->
        <div class="fork-switch-row" style="margin: 10px;">
          <input class="fork-switch" type="checkbox" role="switch" id="bluetoothSwitch" onchange="bluetoothChange()">
          <label for="bluetoothSwitch">Use Bluetooth</label>
        </div>
      </div>
      <!-- fork: what the switch above means for this transfer — who shows the QR code and password,
           and who scans or types it — said before the transfer starts rather than during it -->
      <small id="bluetoothHint" style="margin: -4px 10px 6px 20px; opacity: 0.85;"></small>

      <!-- mode box -->
      <label id="modeInstruction" style="margin-left: 10px">Select File Mode</label>
      <div class="fork-seg-group" role="group" aria-label="Mode selector" id="modeBox" style="margin: 10px; margin-top: 0px;">
        <input type="radio" class="fork-seg-input" name="moderadio" id="sendButton" autocomplete="off" onchange="modeChange('send')">
        <label class="fork-seg" for="sendButton">Send</label>

        <input type="radio" class="fork-seg-input" name="moderadio" id="receiveButton" autocomplete="off" onchange="modeChange('receive')">
        <label class="fork-seg" for="receiveButton">Receive</label>
      </div>

      <!-- connection mode box -->
      <label id="connectionModeLabel" style="margin-left: 10px">Select Connection Mode</label>
      <div class="fork-seg-group" role="group" aria-label="Connection mode selector" id="connectionModeBox" style="margin: 10px; margin-top: 0px;">
        <input type="radio" class="fork-seg-input" name="connectionradio" id="hotspotButton" autocomplete="off" onchange="connectionModeChange('hotspot')">
        <label class="fork-seg" for="hotspotButton">Hotspot</label>

        <input type="radio" class="fork-seg-input" name="connectionradio" id="sharedNetworkButton" autocomplete="off" onchange="connectionModeChange('shared_network')" checked>
        <label class="fork-seg" for="sharedNetworkButton">Shared Network</label>
      </div>

      <!-- peer box -->
      <label id="peerLabel" style="margin-left: 10px">Select Peer OS</label>
      <div class="fork-seg-group" role="group" aria-label="Peer selector" id="peerBox" style="margin: 10px; margin-top: 0px;">
        <input type="radio" class="fork-seg-input" name="peerradio" id="androidButton" autocomplete="off" onchange="peerChange('android')">
        <label class="fork-seg" for="androidButton">Android</label>

        <input type="radio" class="fork-seg-input" name="peerradio" id="iosButton" autocomplete="off" onchange="peerChange('ios')">
        <label class="fork-seg" for="iosButton">iOS</label>

        <input type="radio" class="fork-seg-input" name="peerradio" id="linuxButton" autocomplete="off" onchange="peerChange('linux')">
        <label class="fork-seg" for="linuxButton">Linux</label>

        <input type="radio" class="fork-seg-input" name="peerradio" id="macButton" autocomplete="off" onchange="peerChange('mac')">
        <label class="fork-seg" for="macButton">macOS</label>

        <input type="radio" class="fork-seg-input" name="peerradio" id="windowsButton" autocomplete="off" onchange="peerChange('windows')">
        <label class="fork-seg" for="windowsButton">Windows</label>
      </div>

      <!-- start/cancel buttons -->
      <!-- the two directory buttons share one centred row; the second only appears once something is remembered -->
      <div id="startRow" style="display: flex; justify-content: center; align-items: center; gap: 10px; margin: 10px; flex-grow: 0; flex-shrink: 0;">
        <button type="button" id="startButton" class="fork-pill fork-big" onclick="startFiles()" style="min-height: 25px; padding-left: 24px; padding-right: 24px; flex: 0 0 auto;" disabled>Files to send</button>
        <!-- the directory half of what used to be a tick box: same row, same dress,
             one tap instead of tick-then-tap. Send mode only; hidden while receiving. -->
        <button type="button" id="sendDirButton" class="fork-pill fork-big" onclick="startDirectory()" style="display: none; min-height: 25px; padding-left: 24px; padding-right: 24px; flex: 0 0 auto;" disabled>Directory to send</button>
        <!-- reuse the directory picked last time: same effect as picking it again, one tap -->
        <button type="button" id="lastDirButton" class="fork-pill fork-big" onclick="useLastDirectory()" style="display: none; min-height: 25px; padding-left: 24px; padding-right: 24px; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 1 auto;"></button>
      </div>
      <button type="button" id="cancelButton" class="fork-pill fork-big" onclick="cancelTransfer()" style="display: none; margin: 10px; min-height: 25px;">Cancel Transfer</button>

      <!-- output box -->
      <div id="outputBox" class="horizontalContainer" style="flex-grow: 9; flex-shrink: 9; overflow-y: auto; padding: 5px; margin-top: 5px;">
        Welcome to 白い熊 魔法絨毯!<br>Once other options are selected, drag and drop can be used to start a transfer.
      </div>

      <!-- fork: paired transfers in progress, one block each (lanes.js). Empty and hidden
           while there are none; the bars below belong to hotspot and password transfers. -->
      <div id="laneStack" hidden></div>

      <!-- two lines above the bars while a transfer runs: the current file, then the whole transfer -->
      <div id="progressDetails" style="display: none; text-align: center; margin-top: 5px; font-variant-numeric: tabular-nums;"></div>
      <div id="progressTotalDetails" style="display: none; text-align: center; font-variant-numeric: tabular-nums;"></div>
      <!-- progress bar: current file -->
      <progress id="progressBar" value="0" max="100" style="display: none; appearance: none; width: 100%; margin-top: 5px; margin-bottom: 2px; padding-left: 5px; padding-right: 5px; height: 15px; min-height: 15px;"></progress>
      <!-- progress bar: whole transfer -->
      <progress id="totalProgressBar" value="0" max="100" style="display: none; appearance: none; width: 100%; margin-bottom: 5px; padding-left: 5px; padding-right: 5px; height: 15px; min-height: 15px;"></progress>
    </div>

    <!-- input dialog, used instead of window.prompt() because the webview's native prompt
         shows its origin (e.g. "127.0.0.1:1430 says:") in the title bar.
         kept outside mainContainer so its key events don't reach the Enter-to-start handler. -->
    <div id="promptOverlay">
      <div id="promptCard">
        <div id="promptMessage" style="white-space: pre-wrap; margin-bottom: 10px;"></div>
        <input type="text" id="promptInput" class="fork-text-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" style="margin-bottom: 15px;">
        <!-- fork: the pill bar every dialog of the theme uses. A choice between several things
             (the network interface) is no longer a dropdown in this card: showSelect() in
             main.js opens the theme's own list of pill rows instead. -->
        <div class="fork-info-actions">
          <button type="button" id="promptCancel" class="fork-pill">Cancel</button>
          <button type="button" id="promptOk" class="fork-pill fork-main">OK</button>
        </div>
      </div>
    </div>
  </body>
</html>
