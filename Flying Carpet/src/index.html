<!DOCTYPE html>
<html lang="en" style="height: 100%;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>白い熊 魔法絨毯</title>
    <script type="module" src="/main.js" defer></script>
    <script type="module" src="/customize.js" defer></script>
    <!-- <script type="module" src="/deps/bootstrap.bundle.min.js" defer></script> -->
    <link rel="stylesheet" href="/deps/bootstrap.min.css">
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="customize.css" />
  </head>

  <body style="height: 100%;">
    <div class="verticalContainer" id="mainContainer" style="height: 100%;">

      <!-- top bar -->
      <div class="horizontalContainer" style="flex-grow: 0; margin: 10px;">
        <div>
          <h1 id="programTitle" style="font-size: 40px; margin-bottom: 0px; padding-bottom: 0px;"><b>白い熊 魔法絨毯</b></h1>
          <small id="versionLabel" style="margin-top: 0px; padding-top: 0px;">Version 10</small>
          <small style="margin-top: 0px; padding-top: 0px; float: right; cursor: pointer;" id="aboutButton">
            About
          </small>
        </div>
        <div class="verticalContainer" style="align-items: flex-end;">
          <div id="qrcode" style="width: 150px; height: 150px;">
            <img src="assets/icon1024.png" data-logo style="width: 150px; height: 150px;">
          </div>
          <button type="button" id="uiButton" onclick="window.forkUI.openSettings()">白い熊 魔法絨毯 UI</button>
        </div>
      </div>
      <div class="horizontalContainer" style="flex-grow: 0; margin: 10px;">
        <div class="form-check form-switch" style="margin: 10px;">
          <input class="form-check-input"  style="width: 40px; height: 20px; margin-right: 5px;" type="checkbox" role="switch" id="bluetoothSwitch" onchange="bluetoothChange()">
          <label class="form-check-label" for="bluetoothSwitch">Use Bluetooth</label>
        </div>
      </div>
      <!-- fork: what the switch above means for this transfer — who shows the QR code and password,
           and who scans or types it — said before the transfer starts rather than during it -->
      <small id="bluetoothHint" style="margin: -4px 10px 6px 20px; opacity: 0.85;"></small>

      <!-- mode box -->
      <label id="modeInstruction" style="margin-left: 10px">Select File Mode</label>
      <div class="btn-group" role="group" aria-label="Mode selector" id="modeBox" style="margin: 10px; margin-top: 0px;">
        <input type="radio" class="btn-check" name="moderadio" id="sendButton" autocomplete="off" onchange="modeChange('send')">
        <label class="btn btn-outline-primary" for="sendButton">Send</label>

        <input type="radio" class="btn-check" name="moderadio" id="receiveButton" autocomplete="off" onchange="modeChange('receive')">
        <label class="btn btn-outline-primary" for="receiveButton">Receive</label>
      </div>

      <!-- connection mode box -->
      <label id="connectionModeLabel" style="margin-left: 10px">Select Connection Mode</label>
      <div class="btn-group" role="group" aria-label="Connection mode selector" id="connectionModeBox" style="margin: 10px; margin-top: 0px;">
        <input type="radio" class="btn-check" name="connectionradio" id="hotspotButton" autocomplete="off" onchange="connectionModeChange('hotspot')">
        <label class="btn btn-outline-primary" for="hotspotButton">Hotspot</label>

        <input type="radio" class="btn-check" name="connectionradio" id="sharedNetworkButton" autocomplete="off" onchange="connectionModeChange('shared_network')" checked>
        <label class="btn btn-outline-primary" for="sharedNetworkButton">Shared Network</label>
      </div>

      <!-- peer box -->
      <label id="peerLabel" style="margin-left: 10px">Select Peer OS</label>
      <div class="btn-group" role="group" aria-label="Peer selector" id="peerBox" style="margin: 10px; margin-top: 0px;">
        <input type="radio" class="btn-check" name="peerradio" id="androidButton" autocomplete="off" onchange="peerChange('android')">
        <label class="btn btn-outline-primary" for="androidButton">Android</label>

        <input type="radio" class="btn-check" name="peerradio" id="iosButton" autocomplete="off" onchange="peerChange('ios')">
        <label class="btn btn-outline-primary" for="iosButton">iOS</label>

        <input type="radio" class="btn-check" name="peerradio" id="linuxButton" autocomplete="off" onchange="peerChange('linux')">
        <label class="btn btn-outline-primary" for="linuxButton">Linux</label>

        <input type="radio" class="btn-check" name="peerradio" id="macButton" autocomplete="off" onchange="peerChange('mac')">
        <label class="btn btn-outline-primary" for="macButton">macOS</label>

        <input type="radio" class="btn-check" name="peerradio" id="windowsButton" autocomplete="off" onchange="peerChange('windows')">
        <label class="btn btn-outline-primary" for="windowsButton">Windows</label>
      </div>

      <!-- start/cancel buttons -->
      <!-- the two directory buttons share one centred row; the second only appears once something is remembered -->
      <div id="startRow" style="display: flex; justify-content: center; align-items: center; gap: 10px; margin: 10px; flex-grow: 0; flex-shrink: 0;">
        <button type="button" id="startButton" class="btn btn-success" onclick="startFiles()" style="min-height: 25px; padding-left: 24px; padding-right: 24px; flex: 0 0 auto;" disabled>Files to send</button>
        <!-- the folder half of what used to be a "Send Folder" tick box: same row, same dress,
             one tap instead of tick-then-tap. Send mode only; hidden while receiving. -->
        <button type="button" id="sendDirButton" class="btn btn-success" onclick="startDirectory()" style="display: none; min-height: 25px; padding-left: 24px; padding-right: 24px; flex: 0 0 auto;" disabled>Directory to send</button>
        <!-- reuse the directory picked last time: same effect as picking it again, one tap -->
        <button type="button" id="lastFolderButton" class="btn btn-success" onclick="useLastFolder()" style="display: none; min-height: 25px; padding-left: 24px; padding-right: 24px; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 1 auto;"></button>
      </div>
      <button type="button" id="cancelButton" class="btn btn-danger" onclick="cancelTransfer()" style="display: none; margin: 10px; min-height: 25px;">Cancel Transfer</button>

      <!-- output box -->
      <div id="outputBox" class="horizontalContainer" style="flex-grow: 9; flex-shrink: 9; overflow-y: auto; padding: 5px; margin-top: 5px;">
        Welcome to Flying Carpet!<br>Once other options are selected, drag and drop can be used to start a transfer.
      </div>

      <!-- two lines above the bars while a transfer runs: the current file, then the whole transfer -->
      <div id="progressDetails" style="display: none; text-align: center; margin-top: 5px; font-variant-numeric: tabular-nums;"></div>
      <div id="progressTotalDetails" style="display: none; text-align: center; font-variant-numeric: tabular-nums;"></div>
      <!-- progress bar: current file -->
      <progress id="progressBar" value="0" max="100" style="display: none; appearance: none; width: 100%; margin-top: 5px; margin-bottom: 2px; padding-left: 5px; padding-right: 5px; height: 15px; min-height: 15px;"></progress>
      <!-- progress bar: whole transfer -->
      <progress id="totalProgressBar" value="0" max="100" style="display: none; appearance: none; width: 100%; margin-bottom: 5px; padding-left: 5px; padding-right: 5px; height: 15px; min-height: 15px;"></progress>
    </div>

    <!-- input dialog, used instead of window.prompt() because the webview's native prompt
         shows its origin (e.g. "127.0.0.1:1430 says:") in the title bar.
         kept outside mainContainer so its key events don't reach the Enter-to-start handler. -->
    <div id="promptOverlay">
      <div id="promptCard">
        <div id="promptMessage" style="white-space: pre-wrap; margin-bottom: 10px;"></div>
        <input type="text" id="promptInput" class="form-control" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" style="margin-bottom: 15px;">
        <!-- dropdown variant, used by showSelect() (e.g. the network interface chooser) -->
        <select id="promptSelect" class="form-select" style="margin-bottom: 15px; display: none;"></select>
        <!-- fork: the ArcaneChat pill bar the Export/Import dialogs use, not Bootstrap's
             grey/green button pair, which ignored the theme entirely -->
        <div class="fork-info-actions">
          <button type="button" id="promptCancel" class="fork-pill">Cancel</button>
          <button type="button" id="promptOk" class="fork-pill">OK</button>
        </div>
      </div>
    </div>
  </body>
</html>
