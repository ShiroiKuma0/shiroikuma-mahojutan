plugins {
    id 'com.android.application'
}

// ── shiroikuma fork versioning ──────────────────────────────────────────────
// versionName tracks the FlyingCarpet *release* version (the `v*` git tag / the
// desktop Cargo.toml + tauri.conf.json), NOT this build.gradle's historical
// value — upstream lets the Android versionName lag the release (e.g. it was
// 9.0.8 at the v9.0.10 release). versionCode follows the sister-repo rule:
//   versionCode = <upstream Android versionCode> * 10000 + <buildNumber>
// buildNumber is our fork increment; it resets to 1 on each upstream rebase and
// bumps +1 per delivered build. See .claude/skills/upstream-new-version.
// In the versionName (and therefore the APK filename) it is ALWAYS zero-padded to
// three digits — "+026", never "+26" — so builds sort correctly in ~/tmp, in the
// phone's file manager and in the release list, where "+10" would otherwise land
// before "+3". The versionCode keeps the plain integer; padding is text only.
// NB at v10.0.3 the two upstream sources disagree: the release tag says 10.0.3 (Android was
// bumped last) while the desktop crates still say 10.0.1. The tag is the release, so both our
// artifacts carry 10.0.3 and keep sharing one version string.
def releaseVersionName = "10.0.3"   // = latest upstream `v*` tag
def upstreamVersionCode = 24        // = upstream Android defaultConfig.versionCode
def buildNumber = 47                // fork build; reset to 1 each upstream bump

def paddedBuildNumber = String.format("%03d", buildNumber)
def forkVersionName = "${releaseVersionName}+${paddedBuildNumber}"
def forkVersionCode = upstreamVersionCode * 10000 + buildNumber  // 240001

// Release signing: read from a gitignored keystore.properties at the Gradle
// project root, falling back to SIGNING_* env vars. Without either, the release
// build is unsigned (and won't install). See .claude/skills/build-apk.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystoreProperties = keystorePropertiesFile.exists()
if (hasKeystoreProperties) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def hasSigningEnv = System.getenv("SIGNING_STORE_FILE") != null

// Raw APK is e.g. shiroikuma-mahojutan_10.0.3+001_arm64-v8a-release.apk; the build-apk skill
// copies it to ~/tmp under the clean name (no -release). This is the `base` extension rather
// than defaultConfig.archivesBaseName, which AGP 9 removed.
base {
    archivesName = "shiroikuma-mahojutan_${forkVersionName}_arm64-v8a"
}

android {
    compileSdk = 37

    // https://github.com/spieglt/FlyingCarpet/issues/99
    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }

    defaultConfig {
        applicationId = "shiroikuma.mahojutan"
        minSdk = 29
        targetSdk = 37
        versionCode = forkVersionCode
        versionName = forkVersionName

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasKeystoreProperties || hasSigningEnv) {
            release {
                if (hasKeystoreProperties) {
                    keyAlias keystoreProperties.getProperty("keyAlias")
                    keyPassword keystoreProperties.getProperty("keyPassword")
                    storeFile file(keystoreProperties.getProperty("storeFile"))
                    storePassword keystoreProperties.getProperty("storePassword")
                } else {
                    keyAlias System.getenv("SIGNING_KEY_ALIAS")
                    keyPassword System.getenv("SIGNING_KEY_PASSWORD")
                    storeFile file(System.getenv("SIGNING_STORE_FILE"))
                    storePassword System.getenv("SIGNING_STORE_PASSWORD")
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystoreProperties || hasSigningEnv) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    // Code namespace stays upstream's (R class + Kotlin package dev.spiegl.flyingcarpet);
    // only applicationId is rebranded, so the fork installs side-by-side with upstream.
    namespace = 'dev.spiegl.flyingcarpet'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation "org.jetbrains.kotlin:kotlin-reflect:2.2.10"
}
