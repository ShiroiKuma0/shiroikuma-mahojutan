plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ── shiroikuma fork versioning ──────────────────────────────────────────────
// versionName tracks the FlyingCarpet *release* version (the `v*` git tag / the
// desktop Cargo.toml + tauri.conf.json), NOT this build.gradle's historical
// value — upstream lets the Android versionName lag the release (e.g. it was
// 9.0.8 at the v9.0.10 release). versionCode follows the sister-repo rule:
//   versionCode = <upstream Android versionCode> * 10000 + <buildNumber>
// buildNumber is our fork increment; it resets to 1 on each upstream rebase and
// bumps +1 per delivered build. See .claude/skills/upstream-new-version.
// In the versionName (and therefore the APK filename) it is ALWAYS zero-padded to
// three digits — "+026", never "+26" — so builds sort correctly in ~/tmp, in the
// phone's file manager and in the release list, where "+10" would otherwise land
// before "+3". The versionCode keeps the plain integer; padding is text only.
def releaseVersionName = "9.0.10"   // = latest upstream `v*` tag / desktop Cargo version
def upstreamVersionCode = 21        // = upstream Android defaultConfig.versionCode
def buildNumber = 52                // fork build; reset to 1 each upstream bump

def paddedBuildNumber = String.format("%03d", buildNumber)
def forkVersionName = "${releaseVersionName}+${paddedBuildNumber}"
def forkVersionCode = upstreamVersionCode * 10000 + buildNumber  // 210052

// Release signing: read from a gitignored keystore.properties at the Gradle
// project root, falling back to SIGNING_* env vars. Without either, the release
// build is unsigned (and won't install). See .claude/skills/build-apk.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystoreProperties = keystorePropertiesFile.exists()
if (hasKeystoreProperties) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def hasSigningEnv = System.getenv("SIGNING_STORE_FILE") != null

android {
    compileSdk 34

    // https://github.com/spieglt/FlyingCarpet/issues/99
    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }

    defaultConfig {
        applicationId "shiroikuma.mahojutan"
        minSdk 29
        targetSdk 35
        versionCode forkVersionCode
        versionName forkVersionName

        // Raw APK is e.g. shiroikuma-mahojutan_9.0.10+026_arm64-v8a-release.apk;
        // the build-apk skill copies it to ~/tmp under the clean name (no -release).
        setProperty("archivesBaseName", "shiroikuma-mahojutan_${forkVersionName}_arm64-v8a")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasKeystoreProperties || hasSigningEnv) {
            release {
                if (hasKeystoreProperties) {
                    keyAlias keystoreProperties.getProperty("keyAlias")
                    keyPassword keystoreProperties.getProperty("keyPassword")
                    storeFile file(keystoreProperties.getProperty("storeFile"))
                    storePassword keystoreProperties.getProperty("storePassword")
                } else {
                    keyAlias System.getenv("SIGNING_KEY_ALIAS")
                    keyPassword System.getenv("SIGNING_KEY_PASSWORD")
                    storeFile file(System.getenv("SIGNING_STORE_FILE"))
                    storePassword System.getenv("SIGNING_STORE_PASSWORD")
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystoreProperties || hasSigningEnv) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    // Code namespace stays upstream's (R class + Kotlin package dev.spiegl.flyingcarpet);
    // only applicationId is rebranded, so the fork installs side-by-side with upstream.
    namespace 'dev.spiegl.flyingcarpet'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation 'com.google.zxing:core:3.5.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation "org.jetbrains.kotlin:kotlin-reflect:1.9.20"
}
